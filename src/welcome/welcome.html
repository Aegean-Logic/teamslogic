<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<style>
	* {
		box-sizing: border-box;
	}

	html,
	body {
		padding: 0;
		margin: 0;
		height: 100vh;
		color: white;
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Cantarell, Ubuntu, 'Helvetica Neue', Arial, sans-serif, 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
		user-select: none;
		-webkit-app-region: drag;
	}

	body {
		background: <%= __BUILD_CONFIG__.brandGradient %>;
	}

	.hidden {
		display: none;
	}

	.quit {
		-webkit-app-region: no-drag;
		position: fixed;
		inset-block-start: 4px;
		inset-inline-end: 4px;
		width: 44px;
		height: 44px;
		border: none;
		background: transparent var(--original-icon-close-white) no-repeat center;
		background-size: 20px;
		cursor: pointer;
	}

	.quit_mac {
		inset-inline-start: 4px;
		inset-inline-end: auto;
	}

	.wrapper {
		display: flex;
		flex-direction: column;
		align-items: center;
		height: 100vh
	}

	.logo {
		width: 100%;
		padding: 90px 50px 32px 50px
	}

	@keyframes animateCloud {
		0% {
			margin-left: -100%;
		}
		100% {
			margin-left: 100%;
		}
	}

	.footer {
		margin: 16px;
		text-align: center;
		margin-block-start: auto;
	}

	.clouds {
		position: relative;
		overflow: hidden;
		height: 150px;
		width: 100%;
	}

	.cloud {
		--height: 30px;
		--width: calc(var(--height) * 3);
		background: #fff;
		border-radius: calc(var(--height) * 0.75);
		height: var(--height);
		position: absolute;
		width: var(--width);
		top: var(--height);
		transform: scale(1);
		animation: animateCloud 5s linear infinite;
	}

	.cloud:after {
		border-radius: 100%;
		height: 80%;
		aspect-ratio: 1/1;
		left: 15%;
		top: -45%;
	}

	.cloud:after, .cloud:before {
		background: #fff;
		content: '';
		position: absolute;
		z-index: -1;
	}

	.cloud:before {
		border-radius: 100%;
		aspect-ratio: 1/1;
		height: 150%;
		right: 15%;
		top: -80%;
	}

	/* TeamsLogic: shown in place of the clouds while the server doesn't answer */
	.wrapper_problem .logo {
		padding-block-start: 48px;
		padding-block-end: 16px;
	}

	.wrapper_problem .clouds {
		display: none;
	}

	.problem {
		-webkit-app-region: no-drag;
		width: 100%;
		padding: 0 20px;
		text-align: center;
		user-select: text;
	}

	.problem p {
		margin: 0 0 8px;
		font-size: 13px;
		line-height: 1.4;
	}

	.problem .problem__title {
		font-size: 15px;
		font-weight: 600;
	}

	.problem .problem__retry {
		opacity: 0.8;
	}

	.problem__actions {
		display: flex;
		flex-direction: column;
		gap: 8px;
		margin-block-start: 12px;
	}

	.problem__button {
		height: 34px;
		border: 1px solid rgba(255, 255, 255, 0.7);
		border-radius: 17px;
		background: transparent;
		color: inherit;
		font: inherit;
		font-size: 13px;
		cursor: pointer;
	}

	.problem__button:hover,
	.problem__button:focus-visible {
		background: rgba(255, 255, 255, 0.15);
	}

	.problem__button_primary {
		border-color: white;
		background: white;
		color: <%= __BUILD_CONFIG__.brandColor %>;
		font-weight: 600;
	}

	.problem__button_primary:hover,
	.problem__button_primary:focus-visible {
		background: rgba(255, 255, 255, 0.85);
	}

	.problem__button:disabled {
		opacity: 0.6;
		cursor: default;
	}
	</style>
</head>
<body>
	<div class="wrapper">
		<img class="logo" src="<%= require('../../img/talk-logo.svg') %>" alt="" />
		<div class="clouds">
			<div class="cloud" style="--height: 20px; animation: animateCloud 2s linear infinite;"></div>
			<div class="cloud" style="--height: 16px; animation: animateCloud 1.5s linear infinite; top: 80px; left: 50px"></div>
			<div class="cloud" style="--height: 28px; animation: animateCloud 3s linear infinite; top: 50px; left: 20px"></div>
			<div class="cloud" style="--height: 30px; animation: animateCloud 5s linear infinite; top: 75px;"></div>
			<div class="cloud" style="--height: 40px; animation: animateCloud 10s linear infinite; top: 100px; left: 150px"></div>
		</div>
		<div class="problem hidden" role="alert">
			<p class="problem__title"></p>
			<p class="problem__text"></p>
			<p class="problem__retry"></p>
			<div class="problem__actions">
				<button class="problem__button problem__button_primary problem__try-again" type="button"></button>
				<button class="problem__button problem__change-server" type="button"></button>
			</div>
		</div>
		<div class="spacer"></div>
		<div class="footer"></div>
	</div>
	<button class="quit hidden" aria-label="Quit" type="button"></button>
</body>
</html>
