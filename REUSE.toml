version = 1
SPDX-PackageName = "talk-desktop"
SPDX-PackageSupplier = "Nextcloud <info@nextcloud.com>"
SPDX-PackageDownloadLocation = "https://github.com/nextcloud/talk-desktop/"

[[annotations]]
path = ["l10n/**.js", "l10n/**.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [".github/ISSUE_TEMPLATE/bug_report.md", ".github/ISSUE_TEMPLATE/feature_request.md", ".github/dependabot.yml", ".github/pull_request_template.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["package.json", "package-lock.json", "**/package.json", "**/package-lock.json", ".tx/config", ".tx/backport", "tsconfig.json", "jsconfig.json", "resources/macos/entitlements.plist"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".env.example"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "CC0-1.0"

# TeamsLogic: the icon, the images derived from it (scripts/teamslogic-branding.cjs) and the
# installer images are original work in the Aegean Logic palette, licensed like the icons of
# GridLogic and SlideLogic. They replace Nextcloud's trademarked artwork.
[[annotations]]
path = ["brand/**", "img/talk-**.svg", "img/icons/**", "img/squirrel-install-loading.gif", "img/server-logo-plain.svg", "img/dmg-background.png", "img/dmg-background@2x.png", "img/wix-background.bmp", "img/wix-banner.bmp", "TeamsLogic-*.png", ".overrides/build.config.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aegean Logic"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# TeamsLogic: the Windows installer's banner and signing script, as in SlideLogic (MIT OR Apache-2.0)
[[annotations]]
path = ["packaging/windows/branding/**", "packaging/windows/sign.ps1"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aegean Logic"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# TeamsLogic: the Aegean Logic marks, trademarks of Aegean Logic (docs/brand/LICENSE-brand.txt)
[[annotations]]
path = ["docs/brand/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Aegean Logic <https://www.aegeanlogic.co.uk>"
SPDX-License-Identifier = "LicenseRef-AegeanLogicTrademarks"

[[annotations]]
path = "resources/vue-devtools.crx"
precedence = "aggregate"
SPDX-FileCopyrightText = "Evan You <https://github.com/vuejs/devtools/blob/main/LICENSE>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["sounds/notification.ogg", "sounds/talk.ogg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Feandesign https://soundcloud.com/feandesign"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["build/build.config.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
